name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tracked Go module metadata
        run: go mod tidy -diff
      - name: Formatting report
        run: gofmt -l ./cmd ./internal
      - name: Install Qt desktop test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libegl1 libgl1 libxkbcommon0
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install "PySide6>=6.6,<7"
      - name: Static checks for Linux desktop and install scripts
        run: |
          python3 -m py_compile gui/nethervpn_qt.py gui/nethervpn.py gui/client_preferences.py
          python3 -m unittest discover -s tests -p 'test_desktop_*.py' -v
          QT_QPA_PLATFORM=offscreen .venv-ci/bin/python -m unittest discover -s tests -p 'test_gui_smoke.py' -v
          bash -n scripts/*.sh
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
