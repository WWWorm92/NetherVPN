name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Dependency checksum audit
        run: |
          echo '===== BEGIN GO.SUM ====='
          cat go.sum
          echo '===== END GO.SUM ====='
      - name: Formatting report
        run: gofmt -l ./cmd ./internal
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
