name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
