name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tracked Go module metadata
        run: go mod tidy -diff
      - name: Formatting report
        run: gofmt -l ./cmd ./internal
      - name: Static checks for Linux desktop and install scripts
        run: |
          python3 -m py_compile gui/nethervpn.py gui/client_preferences.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          if command -v xvfb-run >/dev/null; then
            xvfb-run -a python3 -m unittest discover -s tests -p 'test_gui_smoke.py' -v
          else
            echo 'Xvfb not installed: skipping desktop widget smoke test'
          fi
          bash -n scripts/*.sh
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
