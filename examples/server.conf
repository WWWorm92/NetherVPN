# Example server. Create keys locally; NEVER commit real private keys.
# /24 leaves unique addresses for independently authorized Android clients.
[Interface]
Name = nvpn0
PrivateKey = REPLACE_WITH_SERVER_PRIVATE_HEX
Address = 10.77.0.1/24
ListenPort = 51830
MTU = 1280

# Backwards-compatible first Linux peer (single static identity here).
# Additional Android/other clients: sudo nether-admin create -name phone -endpoint PUBLIC_IP:51830
# Their public records go into /etc/nethervpn/peers/.
[Peer]
PublicKey = REPLACE_WITH_LEGACY_LINUX_CLIENT_PUBLIC_HEX
AllowedIPs = 10.77.0.2
